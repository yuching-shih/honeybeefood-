<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員註冊</title>
    <link rel="stylesheet" href="register.css">
</head>

<body>

    <div class="register-box">

        <h1>會員註冊</h1>

        <p class="welcome">加入蜂蜜生活會員</p>

        <form action="login.html">

            <div class="input-group">
                <label for="name">姓名</label>
                <input type="text" id="name" name="name" placeholder="請輸入姓名">
            </div>

            <div class="input-group">
                <label for="email">電子信箱</label>
                <input type="email" id="email" name="email" placeholder="請輸入 Email">
            </div>

            <div class="input-group">
                <label for="username">帳號</label>
                <input type="text" id="username" name="username" placeholder="請設定帳號">
            </div>

            <div class="input-group">
                <label for="password">密碼</label>
                <input type="password" id="password" name="password" placeholder="請設定密碼">
            </div>

            <div class="input-group">
                <label for="password2">確認密碼</label>
                <input type="password" id="password2" name="password2" placeholder="請再次輸入密碼">
            </div>

            <input type="submit" value="註冊" class="register-btn">

        </form>

        <p class="login">
            已經有帳號了？
            <a href="login.html">返回登入</a>
        </p>

    </div>

</body>
</html>
